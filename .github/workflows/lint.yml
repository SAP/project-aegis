name: Lint & Type Check

# Enforcing gate — Ruff format, Ruff lint, and pyright must pass on every
# push/PR. Scoped to src/tests/scripts (all first-party Python), matching the
# pre-commit hooks. Docs markdown code blocks are not gated here.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  lint-typecheck:
    name: Ruff + pyright
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        # --extra dev pulls ruff + pyright (and pytest) from pyproject.toml.
        # This repo builds the package itself, so deps resolve from public PyPI — no internal
        # index credentials needed (unlike downstream consumers).
        run: uv sync --extra dev

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Ruff lint
        run: uv run ruff check --output-format=github src tests scripts

      - name: Pyright
        run: uv run pyright
