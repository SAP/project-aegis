name: Lint & Type Check

# Enforcing gate: Ruff format, Ruff lint, and pyright must pass on every
# push/PR. Scoped to src/tests/scripts (all first-party Python), matching the
# pre-commit hooks. Docs markdown code blocks are not gated here.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  lint-typecheck:
    name: Ruff + pyright
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        # Pin to a full commit SHA, not a moving tag: a tag can be repointed to
        # new code that would then run in CI, so pinning freezes exactly what
        # runs. The trailing comment records the human-readable version.
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Install dev dependencies
        # --extra dev pulls ruff + pyright (and pytest) from pyproject.toml; all
        # dependencies resolve from public PyPI. --locked asserts uv.lock is in
        # sync with pyproject.toml and fails if it has drifted, so CI runs the
        # exact resolution that was committed and reviewed.
        run: uv sync --locked --extra dev

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Ruff lint
        run: uv run ruff check --output-format=github src tests scripts

      - name: Pyright
        run: uv run pyright
