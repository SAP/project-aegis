name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0). Leave blank for a dev build."
        required: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install mkdocs-material "mkdocstrings[python]" mike

      - name: Configure git for mike push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1

      - name: Resolve version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy docs
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$VERSION" = "dev" ]; then
            mike deploy --push dev
          else
            mike deploy --push --update-aliases "$VERSION" latest
          fi

      - name: Keep latest as default docs version
        run: |
          if mike list | awk '/\[[^]]*latest[^]]*\]/ { found = 1 } END { exit found ? 0 : 1 }'; then
            mike set-default --push latest
          fi
