# Issue templates: https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests
# Blank issues are disabled so that every report follows a template. Suspected
# vulnerabilities are handled by GitHub's automatic "Report a security
# vulnerability" link, which it adds to the chooser because a security policy is
# inherited from the SAP organization. We deliberately do not add our own
# security contact_link here, because it would duplicate that automatic entry.
blank_issues_enabled: false

# GitHub Discussions is not enabled yet. Once it is, add a contact_links block
# here to route usage questions and general support there, for example:
#   contact_links:
#     - name: Questions & support
#       url: https://github.com/SAP/project-aegis/discussions
#       about: Ask usage questions and discuss ideas in GitHub Discussions.
