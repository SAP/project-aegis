# Issue templates: https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests
# Blank issues are disabled so that every report follows a template and
# suspected vulnerabilities are steered to the security policy instead.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/SAP/project-aegis/security/policy
    about: >-
      Project Aegis is a security library. Please report suspected
      vulnerabilities privately via our security policy — do not open a
      public issue.
  # GitHub Discussions is not enabled yet. Once it is, uncomment the link
  # below to route usage questions and general support there.
