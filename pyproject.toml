[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# TODO(pre-PyPI-release): the approved PyPI distribution name is kept out of the public repo
# until just before the first PyPI release, to prevent name squatting (OSPO §9). Set it here then.
name = "aegis-placeholder"
version = "1.0.0"
description = "Open-core guardrail library for A2A agent executors"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "SAP SE", email = "ospo@sap.com" }
]

dependencies = [
    "a2a-sdk>=0.3.20,<2",
    "opentelemetry-api>=1.20.0",
    "nh3>=0.2.18",
    "defusedxml>=0.7.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.16,<0.17",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.0", "mkdocstrings[python]>=0.24", "mike>=2.0"]
telemetry = ["opentelemetry-sdk>=1.20.0"]

[project.urls]
source = "https://github.com/SAP/project-aegis"
issues = "https://github.com/SAP/project-aegis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put tests/ on sys.path so files in tests/unit and tests/integration can import
# the shared version-agnostic a2a helper: ``from _a2a_compat import ...``.
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM103: the guard-clause chains in a2a/ are intentionally expanded with a
# per-branch explanatory comment — collapsing to a single boolean return loses
# the rationale. Keep them readable.
ignore = ["SIM103"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
