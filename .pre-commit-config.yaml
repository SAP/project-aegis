# Run: pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # mkdocs.yml uses custom !!python/name tags
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: python
        additional_dependencies: [pyright]
        types: [python]
        pass_filenames: false

      # Conventional Commits enforcement (no node toolchain required).
      - id: commitlint
        name: commitlint (Conventional Commits)
        entry: scripts/commit-msg-lint.sh
        language: script
        stages: [commit-msg]
